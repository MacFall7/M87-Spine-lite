[project]
name = "spine-lite"
version = "0.1.2"
description = "Spine Lite — Governed execution for Claude Code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "jsonschema>=4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Spine Lite is a governance toolkit invoked in-place from the repo root.
# It is not a redistributable package, so no packages are collected.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
